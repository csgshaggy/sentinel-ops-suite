name: Auto-Fix Workflows

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auto-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python YAML parser
        run: |
          python3 -m pip install pyyaml

      - name: Run auto-fix script
        run: |
          echo "🔧 Running auto-fix script..."
          chmod +x auto-fix-workflows.sh
          ./auto-fix-workflows.sh

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Fail if fixes were required
        if: steps.changes.outputs.changed == 'true'
        run: |
          echo "❌ Workflow files required auto-fixes."
          echo "Please run ./auto-fix-workflows.sh locally and commit the results."
          exit 1

      - name: Success
        if: steps.changes.outputs.changed == 'false'
        run: echo "✅ No workflow fixes required."
