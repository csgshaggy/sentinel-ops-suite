name: Frontend CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend/unified-frontend
        run: npm install

      - name: Lint frontend
        working-directory: frontend/unified-frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend/unified-frontend
        run: npm run build
