name: Import Validation

on:
permissions:
  contents: read
  checks: write
  pull_request:
  push:
    branches:
      - main

jobs:
  import-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: frontend/unified-frontend
        run: npm install --legacy-peer-deps

      - name: Run Import Validation Script
        working-directory: frontend/unified-frontend
        run: |
          echo "🔍 Running Import Validation..."
          chmod +x ./scripts/ci_validate_imports.sh
          ./scripts/ci_validate_imports.sh

      - name: Report status
        uses: LouisBrunner/checks-action@v1
        with:
          token: \${{ secrets.GITHUB_TOKEN }}
          name: \${{ github.workflow }}
          conclusion: success
