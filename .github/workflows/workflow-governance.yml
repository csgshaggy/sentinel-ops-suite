---
name: Workflow Governance Pipeline

on:
  workflow_dispatch: {}
  pull_request: {}
  push:
    branches:
      - main

permissions:
  contents: write
  checks: write

jobs:
  self-test:
    name: Environment Self-Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Verify runner environment
        shell: bash
        run: |
          echo "Checking runner environment"
          node -v
          npm -v
          python3 --version
          git --version
          echo "Environment OK"

      - name: Verify repo structure
        shell: bash
        run: |
          if [ ! -d ".github/workflows" ]; then
            echo "Missing workflows directory"
            exit 1
          fi
          echo "Repo structure OK"

  validate:
    name: Validate Workflow Files
    runs-on: ubuntu-latest
    needs: self-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Install Python YAML parser
        shell: bash
        run: python3 -m pip install pyyaml

      - name: Validate workflows
        shell: bash
        run: |
          echo "Validating workflow files"
          WORKFLOW_DIR=".github/workflows"

          for FILE in "$WORKFLOW_DIR"/*.yml; do
            echo "Checking $FILE"

            python3 -c "import yaml; yaml.safe_load(open('$FILE'))"
            echo "YAML valid"

            COUNT=$(grep -c '^on:' "$FILE" || true)
            if [ "$COUNT" -ne 1 ]; then
              echo "Invalid number of on blocks: $COUNT"
              exit 1
            fi
            echo "One on block"

            if ! grep -q '^permissions:' "$FILE"; then
              echo "Missing permissions block"
              exit 1
            fi
            echo "Permissions block present"

            for TRIGGER in pull_request push branches; do
              if ! grep -q "$TRIGGER:" "$FILE"; then
                echo "Missing trigger: $TRIGGER"
                exit 1
              fi
              echo "Trigger present: $TRIGGER"
            done

            case "$FILE" in
              *workflow-governance.yml|*avatar-integrity.yml)
                if ! grep -q 'LouisBrunner/checks-action' "$FILE"; then
                  echo "Missing check-run reporting step"
                  exit 1
                fi
                echo "Check-run reporting step present"
                ;;
              *)
                echo "Skipping checks-action requirement"
                ;;
            esac

            echo ""
          done

          echo "All workflows validated successfully"

  auto-fix:
    name: Auto-Fix Workflow Issues
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Install Python YAML parser
        shell: bash
        run: python3 -m pip install pyyaml

      - name: Run auto-fix script
        shell: bash
        run: |
          echo "Running auto-fix script"
          chmod +x auto-fix-workflows.sh
          bash ./auto-fix-workflows.sh

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-commit fixes
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          echo "Committing workflow fixes"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .github/workflows/*.yml
          git commit -m "Auto-fix workflow YAML issues"
          git push

      - name: Success
        shell: bash
        run: echo "Workflow governance pipeline completed successfully"
