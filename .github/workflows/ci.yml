name: Sentinel Frontend CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ================================
      # Install unified-frontend deps
      # ================================
      - name: Install frontend dependencies
        working-directory: frontend/unified-frontend
        run: npm ci

      # ================================
      # Prebuild validation
      # ================================
      - name: Validate imports
        working-directory: frontend/unified-frontend
        run: ./scripts/ci_validate_imports.sh

      # ================================
      # Vitest Test Runner
      # ================================
      - name: Run Vitest tests
        working-directory: frontend/unified-frontend
        run: npm run test

      - name: Run Vitest coverage
        working-directory: frontend/unified-frontend
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: frontend/unified-frontend/coverage

      # ================================
      # Build
      # ================================
      - name: Build unified-frontend
        working-directory: frontend/unified-frontend
        run: npm run build
