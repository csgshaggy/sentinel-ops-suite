name: Combined CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  checks: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate CI status
        run: echo "All dependent workflows completed."


      - name: Report status
        uses: LouisBrunner/checks-action@v1
        with:
          token: \${{ secrets.GITHUB_TOKEN }}
          name: \${{ github.workflow }}
          conclusion: success
